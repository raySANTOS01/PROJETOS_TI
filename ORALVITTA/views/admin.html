<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel — {{FULL}}</title>
  <link rel="icon" href="{{FAVICON}}" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">
  <!-- Login -->
  <main class="login-screen" id="login-screen" hidden>
    <form class="panel login-card" id="login-form" novalidate>
      <a class="{{BRAND_CLASS}}" href="/" aria-label="Voltar ao site">{{BRAND}}</a>
      <h1>Painel da clínica</h1>
      <p class="muted">Acesso restrito à equipe.</p>
      <div class="alert error" id="login-error" hidden role="alert"></div>
      <label class="field"><span>Usuário</span><input type="text" id="l-user" autocomplete="username" value="admin" required></label>
      <label class="field"><span>Senha</span><input type="password" id="l-pass" autocomplete="current-password" required></label>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>
  </main>

  <!-- App -->
  <div class="shell" id="app" hidden>
    <aside class="sidebar">
      <a class="{{BRAND_CLASS}}" href="/" aria-label="Ver site">{{BRAND_PANEL}}</a>
      <nav id="side-nav" aria-label="Painel">
        <a href="#visao" data-view="visao">Visão geral</a>
        <a href="#agenda" data-view="agenda">Agenda</a>
        <a href="#disponibilidade" data-view="disponibilidade">Disponibilidade</a>
        <a href="#servicos" data-view="servicos">Serviços</a>
        <a href="#config" data-view="config">Configurações</a>
      </nav>
      <button class="btn btn-ghost btn-sm logout" id="logout" type="button">Sair</button>
    </aside>
    <main class="content" id="content" tabindex="-1"></main>
  </div>

  <dialog id="modal"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
